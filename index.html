<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightNote - 轻笺</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>LightNote</h1>
        </div>
        <div class="actions">
          <button id="open-file-btn" type="button">打开文件</button>
          <div class="menu-wrap">
            <button id="display-mode-btn" type="button" aria-expanded="false" aria-label="显示模式">显示模式</button>
            <div id="display-mode-menu" class="dropdown-menu" hidden>
              <button type="button" data-display-mode="editor">单栏编辑</button>
              <button type="button" data-display-mode="preview">单栏预览</button>
              <button type="button" data-display-mode="split">分栏</button>
            </div>
          </div>
        </div>
      </header>

      <section class="workspace">
        <article class="panel editor-panel">
          <h2>编辑</h2>
          <div id="editor"></div>
        </article>

        <article class="panel preview-panel">
          <h2>预览</h2>
          <div id="preview" class="markdown-body"></div>
        </article>
      </section>

      <footer class="status-bar">
        <span id="save-status">准备就绪</span>
      </footer>
    </main>
  </body>
</html>
