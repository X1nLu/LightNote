<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("lightnote.theme");
          const theme = storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = storedTheme === "light" || storedTheme === "dark" ? storedTheme : "system";
        } catch {
          document.documentElement.dataset.theme = "light";
          document.documentElement.dataset.themePreference = "system";
        }
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightNote - 轻笺</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>LightNote</h1>
        </div>
      </header>

      <section class="workspace">
        <article class="panel editor-panel">
          <h2 data-i18n="editor">编辑</h2>
          <div id="editor"></div>
        </article>

        <div
          id="split-divider"
          class="split-divider"
          role="separator"
          aria-label="调整编辑区与预览区宽度"
          aria-orientation="vertical"
          tabindex="-1"
        ></div>

        <article class="panel preview-panel">
          <h2 data-i18n="preview">预览</h2>
          <div id="preview" class="markdown-body"></div>
        </article>
      </section>

      <footer class="status-bar">
        <span id="save-status" data-i18n="ready">准备就绪</span>
      </footer>
    </main>

  </body>
</html>
