<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XL Markdown</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>XL Markdown</h1>
          <p>CodeMirror 6 + KaTeX + Mermaid + SQLite</p>
        </div>
        <div class="actions">
          <button id="open-file-btn" type="button">打开文件</button>
          <button id="view-toggle-btn" type="button">分栏预览</button>
          <button id="edit-toggle-btn" type="button">编辑</button>
          <div class="menu-wrap">
            <button id="more-btn" class="more-btn" type="button" aria-expanded="false" aria-label="更多操作">更多</button>
            <div id="more-menu" class="more-menu" hidden>
              <button id="import-md-btn" type="button">导入 MD</button>
              <button id="export-md-btn" type="button">导出 MD</button>
              <button id="export-html-btn" type="button">导出 HTML</button>
              <button id="export-pdf-btn" type="button">打印到 PDF</button>
            </div>
          </div>
        </div>
      </header>

      <section class="workspace">
        <article class="panel editor-panel">
          <h2>编辑</h2>
          <div id="editor"></div>
          <div id="single-preview" class="markdown-body single-preview" tabindex="0"></div>
        </article>

        <article class="panel preview-panel">
          <h2>预览</h2>
          <div id="preview" class="markdown-body"></div>
        </article>
      </section>

      <footer class="status-bar">
        <span id="save-status">准备就绪</span>
      </footer>
    </main>
  </body>
</html>
